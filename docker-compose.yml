services:
  postgres:
    image: postgres:15-alpine
    pull_policy: if_not_present
    container_name: plu-analyzer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plu_analyzer
      POSTGRES_USER: plu_user
      POSTGRES_PASSWORD: plu_password
    ports:
      - "5433:5432"
    volumes:
      - plu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plu_user -d plu_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    pull_policy: if_not_present
    container_name: plu-analyzer-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: password
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9090:9000"
      - "9091:9001"
    volumes:
      - plu_rustfs_data:/data
      - plu_rustfs_logs:/logs

volumes:
  plu_pgdata:
  plu_rustfs_data:
  plu_rustfs_logs:
